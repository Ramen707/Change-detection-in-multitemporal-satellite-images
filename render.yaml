services:
  - type: web
    name: groundtruth-change-detection
    runtime: static
    buildCommand: mkdir -p dist && cp index.html app.js ai-config.js styles.css dist/
    staticPublishPath: dist

  - type: web
    name: groundtruth-change-detection-ai-api
    runtime: node
    rootDir: ai-api
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ALLOWED_ORIGINS
        value: https://groundtruth-change-detection.onrender.com,http://localhost:8000,http://127.0.0.1:8000
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "3"
      - key: AI_DAILY_REQUEST_LIMIT
        value: "60"